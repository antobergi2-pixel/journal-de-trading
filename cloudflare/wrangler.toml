# Projet Cloudflare Pages du suivi des commissions.
# Le script deployer.sh remplit database_id et les variables d'accès.
name = "suivi-commissions"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "suivi-commissions"
database_id = "A_REMPLIR"

[vars]
TEAM_DOMAIN = ""
POLICY_AUD = ""
EMAIL_AUTORISE = ""
